; Model preset for the llama.cpp router, applied via `outpost preset install
; unified-96gb` (see ../admin/bin/). Keyed by hardware capability tier, not by
; host — any host in the ~90-96GB unified-memory tier uses this file. Applied
; today on framework-desktop (see ../preparation/framework-desktop.md).
;
; Full specification: ../reference/config.md
; Which models need what, and why: ../reference/README.md
;
; Sections here are copies of recipes from ../reference/README.md, not
; authored fresh — each one notes which recipe it came from, so a change to
; the recipe has an obvious place to re-propagate to.

[*]
jinja = true
n-gpu-layers = 999
c = 32768
metrics = true

; --cache-reuse deliberately left unset: tested (tuning.cache-reuse-tuning)
; and confirmed dead in this build (llama-cpp 0.4.0-1, b10809) — the flag
; parses but tools/server has no chunk-reuse implementation left, source-
; verified against the exact running commit. See
; ../research/framework-desktop-followups.md, "Caching and persistence
; flags."

; Recipe: ../reference/README.md, ~90-96GB tier. Larger than [*]'s c = 32768
; (gpt-oss-120b's value) — Qwen3-Coder-Next's KV cache is ~1.5x cheaper per
; token (12 of 48 layers hold a real KV cache vs. gpt-oss's 18 of 36), and
; 131072 is half its trained context_length (262144), leaving margin below
; the RoPE-trained ceiling. Confirmed live: see
; ../research/framework-desktop-followups.md.
[unsloth/Qwen3-Coder-Next-GGUF:Q5_K_M]
c = 131072

; Uncomment when actually loading Gemma 4 (recipe: ../reference/README.md, 12GB/16GB tier).
; unsloth/gemma-4-12b-it-GGUF is the exact repo used there; adjust the quant to
; whichever one you actually load.
;
; [unsloth/gemma-4-12b-it-GGUF:Q4_K_M]
; chat-template = gemma
